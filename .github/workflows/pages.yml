name: Publicar ISAT
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Entorno de ejecución para publicar
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - macos-15
permissions:
  contents: read
concurrency:
  group: isat-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - run: npm install --global pnpm@11.19.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - uses: actions/configure-pages@v5
      - name: Preparar exclusivamente el visualizador
        run: node tools/build-site.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
